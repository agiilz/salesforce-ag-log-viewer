<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; style-src-attr 'unsafe-inline'; script-src 'nonce-${nonce}';">
    <title>Log Details</title>
    <link rel="stylesheet" type="text/css" href="${styleUri}">
</head>
<body>
    <div class="filter-bar">
        <div class="filter-group">
            <label class="checkbox-container">
                <input type="checkbox" id="hide-heap-allocate" checked>
                <span class="checkmark"></span>
                Hide HEAP_ALLOCATE
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="only-user-debug">
                <span class="checkmark"></span>
                Show Debug Logs
            </label>
        </div>
        <div class="search-container">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <label class="sr-only" for="log-search-input">Search log details</label>
            <input id="log-search-input" type="search" placeholder="Search logs..." class="vscode-input">
            <button id="export-raw" type="button">Export log</button>
            <button id="export-summary" type="button">Export summary</button>
        </div>
    </div>
    <div id="summary-strip" role="status" aria-live="polite"></div>
    <div id="log-table-container">
        <div class="table-header-sticky">
            <div id="log-table-header-wrapper">
                <table id="log-table-header">
                    <thead>
                        <tr>
                            <th></th>
                            <th>Time</th>
                            <th>Event</th>
                            <th>Line</th>
                            <th>Details</th>
                        </tr>
                    </thead>
                </table>
            </div>
        </div>
        <div id="virtual-viewport">
            <div id="content-container"></div>
        </div>
    </div>
    <script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
